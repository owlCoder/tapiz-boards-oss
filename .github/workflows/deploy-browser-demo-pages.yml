name: Publish browser demo to GitHub Pages

on:
  push:
    branches:
      - demo/browser-only-no-auth
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-teaching-demo
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout classroom demo
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install packages
        run: npm install --no-audit --no-fund

      - name: Build browser demo with original OSS components
        run: npm run build

      - name: Verify local action contracts
        run: npm run test:demo

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
