name: Publish browser demo to gh-pages branch

on:
  push:
    branches:
      - demo/browser-only-no-auth
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-teaching-demo
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout classroom demo
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install packages
        run: npm install --no-audit --no-fund

      - name: Bundle standalone browser-only demo
        run: |
          mkdir -p dist-pages/assets
          cp pages-demo/index.html dist-pages/index.html
          touch dist-pages/.nojekyll
          npx --yes esbuild@0.25.12 pages-demo/main.tsx \
            --bundle --minify --platform=browser --format=esm \
            --target=es2020 --outdir=dist-pages/assets --alias:@=./src
          test -s dist-pages/index.html
          test -s dist-pages/assets/main.js
          test -s dist-pages/assets/main.css

      # Pages' Actions environment is not initialized for this repository.
      # Publish static files to a dedicated branch instead, without an IAM/OIDC deployment.
      # The repository owner only needs to select 'Deploy from a branch' -> 'gh-pages' -> '/ (root)'.
      - name: Commit compiled site to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist-pages
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish teaching demo for ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:gh-pages
